<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Products | Admin | LUMÉ JEWELS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f6f4;
            color: #222;
        }

        nav {
            height: 70px;
            background: #222;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 40px 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .page-header h1 {
            margin: 0 0 8px;
        }

        .page-header p {
            margin: 0;
            color: #777;
        }

        .add-button {
            background: #222;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .form-container {
            display: none;
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 30px;
        }

        .form-container.active {
            display: block;
        }

        .form-container h2 {
            margin-top: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea {
            padding: 11px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-family: inherit;
        }

        textarea {
            min-height: 80px;
            resize: vertical;
        }

        .checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox input {
            width: auto;
        }

        .form-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
        }

        .save-button,
        .cancel-button {
            padding: 11px 20px;
            border-radius: 6px;
            cursor: pointer;
        }

        .save-button {
            background: #222;
            color: white;
            border: none;
        }

        .cancel-button {
            background: white;
            border: 1px solid #ddd;
        }

        .products-table {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        th {
            background: #f8f8f8;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .edit,
        .delete {
            border: none;
            padding: 7px 11px;
            border-radius: 5px;
            cursor: pointer;
        }

        .edit {
            background: #eee;
        }

        .delete {
            background: #222;
            color: white;
        }

        .status {
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 6px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #777;
        }

        @media (max-width: 700px) {

            nav {
                padding: 0 20px;
            }

            .page-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

    <nav>

        <div class="logo">
            LUMÉ JEWELS — ADMIN
        </div>

        <div>
            <a href="/admin">Dashboard</a>
            <a href="/shop">Store</a>
        </div>

    </nav>


    <main class="container">

        <div class="page-header">

            <div>
                <h1>Product Management</h1>
                <p>Add, edit and remove jewellery products.</p>
            </div>

            <button
                class="add-button"
                onclick="showAddForm()"
            >
                + Add Product
            </button>

        </div>


        <div
            id="status"
            class="status"
        ></div>


        <!-- Product Form -->

        <section
            id="form-container"
            class="form-container"
        >

            <h2 id="form-title">
                Add Product
            </h2>


            <form id="product-form">

                <div class="form-grid">


                    <div class="form-group">

                        <label for="name">
                            Product Name
                        </label>

                        <input
                            type="text"
                            id="name"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="category">
                            Category
                        </label>

                        <input
                            type="text"
                            id="category"
                            required
                        >

                    </div>


                    <div class="form-group full">

                        <label for="description">
                            Description
                        </label>

                        <textarea
                            id="description"
                            required
                        ></textarea>

                    </div>


                    <div class="form-group">

                        <label for="price">
                            Price (₹)
                        </label>

                        <input
                            type="number"
                            id="price"
                            min="0"
                            step="0.01"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="material">
                            Material
                        </label>

                        <input
                            type="text"
                            id="material"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="image">
                            Image URL
                        </label>

                        <input
                            type="url"
                            id="image"
                            placeholder="https://..."
                        >

                    </div>


                    <div class="form-group">

                        <label for="stock">
                            Stock
                        </label>

                        <input
                            type="number"
                            id="stock"
                            min="0"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label class="checkbox">

                            <input
                                type="checkbox"
                                id="featured"
                            >

                            Featured Product

                        </label>

                    </div>

                </div>


                <div class="form-buttons">

                    <button
                        type="submit"
                        class="save-button"
                    >
                        Save Product
                    </button>

                    <button
                        type="button"
                        class="cancel-button"
                        onclick="hideForm()"
                    >
                        Cancel
                    </button>

                </div>

            </form>

        </section>


        <!-- Product Table -->

        <section class="products-table">

            <table>

                <thead>

                    <tr>

                        <th>Name</th>
                        <th>Category</th>
                        <th>Material</th>
                        <th>Price</th>
                        <th>Stock</th>
                        <th>Featured</th>
                        <th>Actions</th>

                    </tr>

                </thead>


                <tbody id="product-list">

                    <tr>
                        <td colspan="7" class="empty">
                            Loading products...
                        </td>
                    </tr>

                </tbody>

            </table>

        </section>

    </main>


    <script>

        let products = [];
        let editingProductId = null;


        async function loadProducts() {

            try {

                const response =
                    await fetch("/api/products");


                if (!response.ok) {
                    throw new Error("Failed to load products");
                }


                products =
                    await response.json();


                displayProducts();

            } catch (error) {

                console.error(error);

                showStatus(
                    "Unable to load products.",
                    true
                );

            }

        }


        function displayProducts() {

            const list =
                document.getElementById(
                    "product-list"
                );


            if (products.length === 0) {

                list.innerHTML = `

                    <tr>

                        <td
                            colspan="7"
                            class="empty"
                        >
                            No products available.
                        </td>

                    </tr>

                `;

                return;
            }


            list.innerHTML =
                products.map(product => `

                    <tr>

                        <td>
                            ${product.name}
                        </td>

                        <td>
                            ${product.category}
                        </td>

                        <td>
                            ${product.material}
                        </td>

                        <td>
                            ₹${Number(product.price)
                                .toLocaleString("en-IN")}
                        </td>

                        <td>
                            ${product.stock}
                        </td>

                        <td>
                            ${product.featured ? "Yes" : "No"}
                        </td>

                        <td>

                            <div class="actions">

                                <button
                                    class="edit"
                                    onclick="editProduct('${product.id}')"
                                >
                                    Edit
                                </button>

                                <button
                                    class="delete"
                                    onclick="deleteProduct('${product.id}')"
                                >
                                    Delete
                                </button>

                            </div>

                        </td>

                    </tr>

                `).join("");

        }


        function showAddForm() {

            editingProductId = null;

            document.getElementById(
                "form-title"
            ).textContent = "Add Product";

            document.getElementById(
                "product-form"
            ).reset();

            document.getElementById(
                "form-container"
            ).classList.add("active");

        }


        function hideForm() {

            editingProductId = null;

            document.getElementById(
                "form-container"
            ).classList.remove("active");

            document.getElementById(
                "product-form"
            ).reset();

        }


        function editProduct(id) {

            const product =
                products.find(
                    item => item.id === id
                );


            if (!product) {
                return;
            }


            editingProductId = id;


            document.getElementById(
                "form-title"
            ).textContent = "Edit Product";


            document.getElementById("name").value =
                product.name || "";


            document.getElementById("description").value =
                product.description || "";


            document.getElementById("price").value =
                product.price;


            document.getElementById("category").value =
                product.category || "";


            document.getElementById("material").value =
                product.material || "";


            document.getElementById("image").value =
                product.image || "";


            document.getElementById("stock").value =
                product.stock;


            document.getElementById("featured").checked =
                product.featured;


            document.getElementById(
                "form-container"
            ).classList.add("active");

        }


        document
            .getElementById("product-form")
            .addEventListener(
                "submit",
                saveProduct
            );


        async function saveProduct(event) {

            event.preventDefault();


            const product = {

                name:
                    document.getElementById("name").value,

                description:
                    document.getElementById("description").value,

                price:
                    Number(
                        document.getElementById("price").value
                    ),

                category:
                    document.getElementById("category").value,

                material:
                    document.getElementById("material").value,

                image:
                    document.getElementById("image").value,

                stock:
                    Number(
                        document.getElementById("stock").value
                    ),

                featured:
                    document.getElementById("featured").checked

            };


            try {

                let response;


                if (editingProductId) {

                    response =
                        await fetch(
                            `/api/products/${editingProductId}`,
                            {
                                method: "PUT",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(product)
                            }
                        );

                } else {

                    response =
                        await fetch(
                            "/api/products",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(product)
                            }
                        );

                }


                if (!response.ok) {

                    const error =
                        await response.json();

                    throw new Error(
                        error.error ||
                        "Unable to save product"
                    );

                }


                showStatus(
                    editingProductId
                        ? "Product updated successfully."
                        : "Product created successfully."
                );


                hideForm();

                await loadProducts();


            } catch (error) {

                console.error(error);

                showStatus(
                    error.message,
                    true
                );

            }

        }


        async function deleteProduct(id) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this product?"
                );


            if (!confirmed) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `/api/products/${id}`,
                        {
                            method: "DELETE"
                        }
                    );


                if (!response.ok) {
                    throw new Error(
                        "Unable to delete product"
                    );
                }


                showStatus(
                    "Product deleted successfully."
                );


                await loadProducts();


            } catch (error) {

                console.error(error);

                showStatus(
                    error.message,
                    true
                );

            }

        }


        function showStatus(message, error = false) {

            const status =
                document.getElementById("status");


            status.textContent = message;

            status.classList.add("show");

            status.style.background =
                error
                    ? "#f8d7da"
                    : "#e8e8e8";


            setTimeout(() => {

                status.classList.remove("show");

            }, 3000);

        }


        loadProducts();

    </script>

</body>

</html>
