<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Checkout | LUMÉ JEWELS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #faf9f7;
            color: #222;
        }

        nav {
            height: 70px;
            background: white;
            border-bottom: 1px solid #e5e5e5;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 50px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            gap: 25px;
        }

        .nav-links a {
            text-decoration: none;
            color: #222;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 50px 20px;
        }

        h1 {
            margin-bottom: 35px;
        }

        .checkout-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 30px;
        }

        .form-section,
        .order-summary {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 10px;
            padding: 25px;
        }

        .form-section h2,
        .order-summary h2 {
            margin-top: 0;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;

            border: 1px solid #ddd;
            border-radius: 6px;

            font-size: 14px;
            font-family: inherit;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #888;
        }

        .place-order {
            width: 100%;
            margin-top: 10px;

            padding: 14px;

            border: none;
            border-radius: 6px;

            background: #222;
            color: white;

            cursor: pointer;
            font-size: 15px;
        }

        .place-order:hover {
            background: #444;
        }

        .place-order:disabled {
            background: #999;
            cursor: not-allowed;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;

            padding: 12px 0;

            border-bottom: 1px solid #eee;

            font-size: 14px;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;

            margin-top: 20px;
            padding-top: 18px;

            border-top: 1px solid #ddd;

            font-size: 18px;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
        }

        .empty a {
            display: inline-block;
            margin-top: 15px;

            padding: 12px 20px;

            background: #222;
            color: white;

            text-decoration: none;
            border-radius: 6px;
        }

        .error {
            color: #b00020;
            font-size: 14px;
            margin-top: 10px;
        }

        @media (max-width: 800px) {

            nav {
                padding: 0 20px;
            }

            .checkout-layout {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>

    <nav>

        <div class="logo">
            LUMÉ JEWELS
        </div>

        <div class="nav-links">

            <a href="/shop">
                Shop
            </a>

            <a href="/cart">
                Cart
            </a>

        </div>

    </nav>


    <main class="container">

        <h1>
            Checkout
        </h1>


        <div id="checkout-container">

            Loading...

        </div>

    </main>


    <script>

        let cart =
            JSON.parse(
                localStorage.getItem("cart")
            ) || [];


        function displayCheckout() {

            const container =
                document.getElementById(
                    "checkout-container"
                );


            if (cart.length === 0) {

                container.innerHTML = `

                    <div class="empty">

                        <h2>
                            Your cart is empty
                        </h2>

                        <p>
                            Add a product before checking out.
                        </p>

                        <a href="/shop">
                            Go to Shop
                        </a>

                    </div>

                `;

                return;
            }


            const total =
                cart.reduce(
                    (sum, item) =>
                        sum + item.price * item.quantity,
                    0
                );


            const items =
                cart.map(item => `

                    <div class="summary-item">

                        <span>
                            ${item.name}
                            × ${item.quantity}
                        </span>

                        <span>
                            ₹${Number(
                                item.price * item.quantity
                            ).toLocaleString("en-IN")}
                        </span>

                    </div>

                `).join("");


            container.innerHTML = `

                <div class="checkout-layout">


                    <section class="form-section">

                        <h2>
                            Customer Information
                        </h2>


                        <form id="checkout-form">


                            <div class="form-group">

                                <label for="name">
                                    Full Name
                                </label>

                                <input
                                    type="text"
                                    id="name"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label for="email">
                                    Email Address
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label for="phone">
                                    Phone Number
                                </label>

                                <input
                                    type="tel"
                                    id="phone"
                                    required
                                >

                            </div>


                            <div class="form-group">

                                <label for="address">
                                    Delivery Address
                                </label>

                                <textarea
                                    id="address"
                                    required
                                ></textarea>

                            </div>


                            <div
                                id="error"
                                class="error"
                            ></div>


                            <button
                                type="submit"
                                class="place-order"
                                id="place-order"
                            >
                                Place Order
                            </button>


                        </form>

                    </section>


                    <aside class="order-summary">

                        <h2>
                            Order Summary
                        </h2>


                        ${items}


                        <div class="summary-item">

                            <span>
                                Delivery
                            </span>

                            <span>
                                Free
                            </span>

                        </div>


                        <div class="summary-total">

                            <span>
                                Total
                            </span>

                            <span>
                                ₹${Number(total)
                                    .toLocaleString("en-IN")}
                            </span>

                        </div>

                    </aside>


                </div>

            `;


            document
                .getElementById("checkout-form")
                .addEventListener(
                    "submit",
                    placeOrder
                );

        }


        async function placeOrder(event) {

            event.preventDefault();


            const button =
                document.getElementById(
                    "place-order"
                );

            const errorElement =
                document.getElementById(
                    "error"
                );


            button.disabled = true;
            button.textContent = "Placing Order...";


            const total =
                cart.reduce(
                    (sum, item) =>
                        sum + item.price * item.quantity,
                    0
                );


            const orderItems =
                cart.map(item => ({

                    productId: item.id,
                    productName: item.name,
                    price: item.price,
                    quantity: item.quantity

                }));


            const order = {

                customerName:
                    document.getElementById("name").value,

                email:
                    document.getElementById("email").value,

                phone:
                    document.getElementById("phone").value,

                address:
                    document.getElementById("address").value,

                items: orderItems,

                totalAmount: total,

                status: "PLACED"

            };


            try {

                const response =
                    await fetch(
                        "/api/orders",
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(order)
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to place order"
                    );

                }


                const savedOrder =
                    await response.json();


                /*
                 * Save order ID so the
                 * confirmation page can display it.
                 */

                localStorage.setItem(
                    "lastOrderId",
                    savedOrder.id
                );


                /*
                 * Empty cart after successful order.
                 */

                localStorage.removeItem("cart");


                /*
                 * Move to confirmation page.
                 */

                window.location.href =
                    "/order-confirmation";


            } catch (error) {

                console.error(error);

                errorElement.textContent =
                    "Unable to place order. Please try again.";

                button.disabled = false;
                button.textContent =
                    "Place Order";

            }

        }


        displayCheckout();

    </script>

</body>

</html>
