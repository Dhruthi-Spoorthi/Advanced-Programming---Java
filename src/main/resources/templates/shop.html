<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shop | Jewellery Store</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #faf9f7;
            color: #222;
        }

        /* Navbar */

        nav {
            height: 70px;
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #222;
            font-size: 15px;
        }

        .cart {
            font-weight: bold;
        }

        /* Header */

        .shop-header {
            text-align: center;
            padding: 55px 20px 30px;
        }

        .shop-header p {
            color: #777;
            margin-top: 10px;
        }

        /* Controls */

        .controls {
            max-width: 1200px;
            margin: 0 auto;
            padding: 10px 20px 30px;
            display: flex;
            gap: 15px;
            justify-content: space-between;
        }

        .search-box {
            flex: 1;
        }

        .search-box input,
        .category-filter select {
            width: 100%;
            padding: 13px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
            font-size: 14px;
        }

        .category-filter {
            width: 220px;
        }

        /* Products */

        #products {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px 60px;

            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .product {
            background: white;
            border: 1px solid #eeeeee;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .product:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        .product-image {
            width: 100%;
            height: 250px;
            background: #f1f1f1;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-placeholder {
            color: #999;
            font-size: 14px;
        }

        .product-content {
            padding: 20px;
        }

        .product-category {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .product h2 {
            font-size: 20px;
            margin: 8px 0;
        }

        .description {
            color: #666;
            font-size: 14px;
            line-height: 1.5;
            min-height: 42px;
        }

        .material {
            font-size: 13px;
            color: #555;
        }

        .product-bottom {
            margin-top: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price {
            font-size: 19px;
            font-weight: bold;
        }

        .stock {
            font-size: 12px;
            color: #777;
        }

        /* Buttons */

        .button-group {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .view-details {
            flex: 1;
            padding: 12px;
            border: 1px solid #222;
            border-radius: 6px;
            background: white;
            color: #222;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            text-align: center;
        }

        .view-details:hover {
            background: #f5f5f5;
        }

        .add-cart {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #222;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .add-cart:hover {
            background: #444;
        }

        .add-cart:disabled {
            background: #aaa;
            cursor: not-allowed;
        }

        .no-products {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px;
            color: #777;
        }

        /* Responsive */

        @media (max-width: 900px) {
            #products {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {

            nav {
                padding: 0 20px;
            }

            .nav-links {
                gap: 15px;
            }

            .nav-links a:not(.cart) {
                display: none;
            }

            .controls {
                flex-direction: column;
            }

            .category-filter {
                width: 100%;
            }

            #products {
                grid-template-columns: 1fr;
            }

            .shop-header {
                padding-top: 35px;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <!-- Navigation -->

    <nav>

        <div class="logo">
            LUMÉ JEWELS
        </div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/shop">Shop</a>
            <a href="/cart" class="cart">
                Cart (<span id="cart-count">0</span>)
            </a>
        </div>

    </nav>


    <!-- Shop Header -->

    <section class="shop-header">

        <h1>Our Jewellery Collection</h1>

        <p>
            Discover timeless pieces crafted for every occasion.
        </p>

    </section>


    <!-- Search and Filter -->

    <section class="controls">

        <div class="search-box">

            <input
                type="text"
                id="search"
                placeholder="Search jewellery..."
            >

        </div>

        <div class="category-filter">

            <select id="category">

                <option value="all">
                    All Categories
                </option>

            </select>

        </div>

    </section>


    <!-- Products -->

    <main id="products">

        <div class="no-products">
            Loading products...
        </div>

    </main>


    <script>

        let allProducts = [];


        /*
         * Load products from the Spring Boot REST API.
         */

        async function loadProducts() {

            const productsContainer =
                document.getElementById("products");

            try {

                const response =
                    await fetch("/api/products");

                if (!response.ok) {

                    throw new Error(
                        "Failed to load products"
                    );

                }

                allProducts = await response.json();

                createCategoryOptions();

                displayProducts(allProducts);

                updateCartCount();

            } catch (error) {

                productsContainer.innerHTML = `
                    <div class="no-products">
                        Unable to load products.
                        Please try again later.
                    </div>
                `;

                console.error(error);

            }

        }


        /*
         * Create category options from the
         * products returned by the API.
         */

        function createCategoryOptions() {

            const categorySelect =
                document.getElementById("category");

            const categories =
                [...new Set(
                    allProducts.map(product => product.category)
                )];

            categories.forEach(category => {

                if (!category) {
                    return;
                }

                const option =
                    document.createElement("option");

                option.value = category;
                option.textContent = category;

                categorySelect.appendChild(option);

            });

        }


        /*
         * Display products on the page.
         */

        function displayProducts(products) {

            const productsContainer =
                document.getElementById("products");

            if (products.length === 0) {

                productsContainer.innerHTML = `
                    <div class="no-products">
                        No jewellery found.
                    </div>
                `;

                return;

            }


            productsContainer.innerHTML =
                products.map(product => `

                    <article class="product">

                        <div class="product-image">

                            ${
                                product.image
                                ?
                                `<img
                                    src="${product.image}"
                                    alt="${product.name}"
                                >`
                                :
                                `<div class="image-placeholder">
                                    Jewellery Image
                                </div>`
                            }

                        </div>


                        <div class="product-content">

                            <div class="product-category">
                                ${product.category || "Jewellery"}
                            </div>

                            <h2>
                                ${product.name}
                            </h2>

                            <p class="description">
                                ${product.description || "Beautifully crafted jewellery piece."}
                            </p>

                            <p class="material">
                                Material: ${product.material || "Premium quality"}
                            </p>


                            <div class="product-bottom">

                                <div class="price">
                                    ₹${Number(product.price).toLocaleString("en-IN")}
                                </div>

                                <div class="stock">
                                    ${product.stock} available
                                </div>

                            </div>


                            <div class="button-group">

                                <a
                                    href="/product/${product.id}"
                                    class="view-details"
                                >
                                    View Details
                                </a>

                                <button
                                    class="add-cart"
                                    onclick="addToCart('${product.id}')"
                                    ${product.stock <= 0 ? "disabled" : ""}
                                >
                                    ${
                                        product.stock > 0
                                        ? "Add to Cart"
                                        : "Out of Stock"
                                    }
                                </button>

                            </div>

                        </div>

                    </article>

                `).join("");

        }


        /*
         * Search products.
         */

        document
            .getElementById("search")
            .addEventListener("input", filterProducts);


        /*
         * Filter by category.
         */

        document
            .getElementById("category")
            .addEventListener("change", filterProducts);


        function filterProducts() {

            const searchValue =
                document
                    .getElementById("search")
                    .value
                    .toLowerCase();

            const categoryValue =
                document
                    .getElementById("category")
                    .value;


            const filteredProducts =
                allProducts.filter(product => {

                    const matchesSearch =
                        product.name
                            .toLowerCase()
                            .includes(searchValue) ||

                        (product.description || "")
                            .toLowerCase()
                            .includes(searchValue);


                    const matchesCategory =
                        categoryValue === "all" ||
                        product.category === categoryValue;


                    return matchesSearch && matchesCategory;

                });


            displayProducts(filteredProducts);

        }


        /*
         * Add product to the browser cart.
         *
         * For now the cart is stored in localStorage.
         */

        function addToCart(productId) {

            const product =
                allProducts.find(
                    item => item.id === productId
                );

            if (!product) {
                return;
            }


            let cart =
                JSON.parse(
                    localStorage.getItem("cart")
                ) || [];


            const existingItem =
                cart.find(
                    item => item.id === productId
                );


            if (existingItem) {

                if (existingItem.quantity < product.stock) {
                    existingItem.quantity++;
                }

            } else {

                cart.push({

                    id: product.id,
                    name: product.name,
                    price: product.price,
                    image: product.image,
                    quantity: 1

                });

            }


            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );


            updateCartCount();

        }


        /*
         * Update cart item count in navbar.
         */

        function updateCartCount() {

            const cart =
                JSON.parse(
                    localStorage.getItem("cart")
                ) || [];


            const count =
                cart.reduce(
                    (total, item) =>
                        total + item.quantity,
                    0
                );


            document.getElementById(
                "cart-count"
            ).textContent = count;

        }


        loadProducts();

    </script>

</body>

</html>
