<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Orders | Admin | LUMÉ JEWELS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f6f6f4;
            color: #222;
        }

        nav {
            height: 70px;
            background: #222;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 40px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 14px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 40px 20px;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
        }

        .status {
            padding: 14px;
            margin-bottom: 20px;
            border-radius: 6px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .orders {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .order {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 25px;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;

            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .order-id {
            font-size: 13px;
            color: #777;
            word-break: break-all;
        }

        .customer-name {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 7px;
        }

        .customer-info {
            font-size: 13px;
            color: #666;
            line-height: 1.6;
        }

        .order-status {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .order-status select {
            padding: 9px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }

        .items {
            padding: 20px 0;
        }

        .items-title {
            font-weight: bold;
            margin-bottom: 12px;
        }

        .item {
            display: flex;
            justify-content: space-between;

            padding: 10px 0;

            border-bottom: 1px solid #f0f0f0;

            font-size: 14px;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item-name {
            font-weight: 500;
        }

        .item-details {
            color: #777;
            font-size: 13px;
            margin-top: 4px;
        }

        .order-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .total {
            font-size: 19px;
            font-weight: bold;
        }

        .delete-button {
            border: none;
            background: #222;
            color: white;

            padding: 9px 15px;

            border-radius: 6px;
            cursor: pointer;
        }

        .delete-button:hover {
            background: #444;
        }

        .empty {
            background: white;
            border: 1px solid #ddd;
            border-radius: 10px;

            padding: 60px 20px;

            text-align: center;
            color: #777;
        }

        @media (max-width: 700px) {

            nav {
                padding: 0 20px;
            }

            .order-header {
                flex-direction: column;
                gap: 20px;
            }

            .order-footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

        }

    </style>

</head>


<body>

    <nav>

        <div class="logo">
            LUMÉ JEWELS — ADMIN
        </div>

        <div>

            <a href="/admin">
                Dashboard
            </a>

            <a href="/shop">
                Store
            </a>

        </div>

    </nav>


    <main class="container">


        <div class="header">

            <h1>
                Order Management
            </h1>

            <p>
                View customer orders and update their status.
            </p>

        </div>


        <div
            id="status"
            class="status"
        ></div>


        <section
            id="orders"
            class="orders"
        >

            <div class="empty">
                Loading orders...
            </div>

        </section>


    </main>


    <script>

        let orders = [];


        /*
         * Load orders from the REST API.
         */

        async function loadOrders() {

            try {

                const response =
                    await fetch("/api/orders");


                if (!response.ok) {

                    throw new Error(
                        "Failed to load orders"
                    );

                }


                orders =
                    await response.json();


                displayOrders();


            } catch (error) {

                console.error(error);

                showStatus(
                    "Unable to load orders.",
                    true
                );

            }

        }


        /*
         * Display all orders.
         */

        function displayOrders() {

            const container =
                document.getElementById(
                    "orders"
                );


            if (orders.length === 0) {

                container.innerHTML = `

                    <div class="empty">

                        <h2>
                            No Orders
                        </h2>

                        <p>
                            There are currently no customer orders.
                        </p>

                    </div>

                `;

                return;
            }


            container.innerHTML =
                orders.map(order => `

                    <article class="order">


                        <div class="order-header">


                            <div>

                                <div class="customer-name">
                                    ${order.customerName}
                                </div>

                                <div class="customer-info">

                                    ${order.email}<br>

                                    ${order.phone}<br>

                                    ${order.address}

                                </div>

                                <div class="order-id">

                                    Order ID:
                                    ${order.id}

                                </div>

                            </div>


                            <div class="order-status">

                                <label>
                                    Status:
                                </label>

                                <select
                                    onchange="updateStatus(
                                        '${order.id}',
                                        this.value
                                    )"
                                >

                                    <option
                                        value="PLACED"
                                        ${order.status === "PLACED" ? "selected" : ""}
                                    >
                                        Placed
                                    </option>

                                    <option
                                        value="PROCESSING"
                                        ${order.status === "PROCESSING" ? "selected" : ""}
                                    >
                                        Processing
                                    </option>

                                    <option
                                        value="SHIPPED"
                                        ${order.status === "SHIPPED" ? "selected" : ""}
                                    >
                                        Shipped
                                    </option>

                                    <option
                                        value="DELIVERED"
                                        ${order.status === "DELIVERED" ? "selected" : ""}
                                    >
                                        Delivered
                                    </option>

                                    <option
                                        value="CANCELLED"
                                        ${order.status === "CANCELLED" ? "selected" : ""}
                                    >
                                        Cancelled
                                    </option>

                                </select>

                            </div>


                        </div>


                        <div class="items">

                            <div class="items-title">
                                Order Items
                            </div>


                            ${
                                (order.items || [])
                                .map(item => `

                                    <div class="item">

                                        <div>

                                            <div class="item-name">
                                                ${item.productName}
                                            </div>

                                            <div class="item-details">

                                                ₹${Number(item.price)
                                                    .toLocaleString("en-IN")}

                                                ×

                                                ${item.quantity}

                                            </div>

                                        </div>


                                        <div>

                                            ₹${Number(
                                                item.price *
                                                item.quantity
                                            ).toLocaleString("en-IN")}

                                        </div>

                                    </div>

                                `)
                                .join("")
                            }

                        </div>


                        <div class="order-footer">


                            <div class="total">

                                Total:
                                ₹${Number(
                                    order.totalAmount
                                ).toLocaleString("en-IN")}

                            </div>


                            <button
                                class="delete-button"
                                onclick="deleteOrder('${order.id}')"
                            >
                                Delete Order
                            </button>


                        </div>


                    </article>

                `).join("");

        }


        /*
         * Update order status.
         */

        async function updateStatus(
            orderId,
            newStatus
        ) {

            const order =
                orders.find(
                    item => item.id === orderId
                );


            if (!order) {
                return;
            }


            const updatedOrder = {

                customerName:
                    order.customerName,

                email:
                    order.email,

                phone:
                    order.phone,

                address:
                    order.address,

                items:
                    order.items,

                totalAmount:
                    order.totalAmount,

                status:
                    newStatus

            };


            try {

                const response =
                    await fetch(
                        `/api/orders/${orderId}`,
                        {
                            method: "PUT",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify(updatedOrder)
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to update order"
                    );

                }


                showStatus(
                    "Order status updated successfully."
                );


                await loadOrders();


            } catch (error) {

                console.error(error);

                showStatus(
                    error.message,
                    true
                );

            }

        }


        /*
         * Delete order.
         */

        async function deleteOrder(id) {

            const confirmed =
                confirm(
                    "Are you sure you want to delete this order?"
                );


            if (!confirmed) {
                return;
            }


            try {

                const response =
                    await fetch(
                        `/api/orders/${id}`,
                        {
                            method: "DELETE"
                        }
                    );


                if (!response.ok) {

                    throw new Error(
                        "Unable to delete order"
                    );

                }


                showStatus(
                    "Order deleted successfully."
                );


                await loadOrders();


            } catch (error) {

                console.error(error);

                showStatus(
                    error.message,
                    true
                );

            }

        }


        function showStatus(
            message,
            error = false
        ) {

            const status =
                document.getElementById(
                    "status"
                );


            status.textContent = message;

            status.classList.add("show");


            status.style.background =
                error
                    ? "#f8d7da"
                    : "#e8e8e8";


            setTimeout(() => {

                status.classList.remove("show");

            }, 3000);

        }


        loadOrders();

    </script>

</body>

</html>
